name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skill_workflow:
        description: 'Run billed, browser-backed Claude workflow completion tests'
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      rust: ${{ steps.plan.outputs.rust }}
      detector: ${{ steps.plan.outputs.detector }}
      live: ${{ steps.plan.outputs.live }}
      framework: ${{ steps.plan.outputs.framework }}
      cli_remote_e2e: ${{ steps.plan.outputs.cli_remote_e2e }}
      live_e2e: ${{ steps.plan.outputs.live_e2e }}
      live_e2e_accept_cleanup: ${{ steps.plan.outputs.live_e2e_accept_cleanup }}
      skill_behavior: ${{ steps.plan.outputs.skill_behavior }}
      live_svelte_adapter_deepseek: ${{ steps.plan.outputs.live_svelte_adapter_deepseek }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect test plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-test-plan.mjs

  test-matrix:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run core tests
        run: npm run test:core
      - name: Run detector tests
        if: needs.changes.outputs.detector == 'true'
        run: npm run test:detector
      - name: Run live unit tests
        if: needs.changes.outputs.live == 'true'
        run: npm run test:live
      - name: Run framework fixture tests
        if: needs.changes.outputs.framework == 'true'
        run: npm run test:framework
      - name: Build
        run: npm run build
      - name: Validate VS Code package
        run: npm run package:vscode
      - name: Install the pinned toolchain
        if: needs.changes.outputs.detector == 'true'
        run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.detector == 'true'
      - name: Install wasm-pack
        if: needs.changes.outputs.detector == 'true'
        run: cargo install wasm-pack --locked
      - name: Build extension
        if: needs.changes.outputs.detector == 'true'
        run: npm run build:extension
      - name: Lint Firefox extension (web-ext)
        if: needs.changes.outputs.detector == 'true'
        run: npx --yes web-ext@10 lint --source-dir dist/extension-firefox
      - name: Verify tracked generated sources stay clean
        if: needs.changes.outputs.detector == 'true'
        run: git diff --exit-code -- crates/live/assets/antipatterns.json skill/scripts/VERSION
      - name: Verify generated tracked outputs
        run: git diff --exit-code -- .agents .claude .cursor .dsh .gemini .github/skills plugin extension/detector
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccable-build-node-${{ matrix.node-version }}
          path: |
            dist/
            !dist/extension-firefox/
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  rust-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Verify Windows extension bundle is non-mutating
        run: cargo xtask bundle --check --extension-only
      - name: Verify tracked generated sources stay clean on Windows
        run: git diff --exit-code -- crates/live/assets/antipatterns.json skill/scripts/VERSION

  launcher-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Exercise Windows launcher downloads and verification
        run: node --test tests/launcher-download.test.mjs

  oracle:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.oracle == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the engine from source
        run: cargo build --release -p impeccable
      - name: Replay oracle goldens
        env:
          IMPECCABLE_BIN: ${{ github.workspace }}/target/release/impeccable
        run: node tests/oracle/run.mjs

  engine-release-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check engine release assets for pinned ENGINE_VERSION
        id: check
        run: node scripts/check-engine-release.mjs
      - name: Annotate missing engine release
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error title=Engine release not ready::The engine release for v$(cat ENGINE_VERSION) is not fully published. Publish it with npm run release:engine and npm run release:platform-packages before bumping ENGINE_VERSION on main or releasing the skill/CLI."

  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Verify Node test matrix
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "test matrix passed"

  cli-remote-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli_remote_e2e == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the engine
        run: cargo build --release -p impeccable
      - name: Run remote CLI E2E smoke
        run: npm run test:cli-remote-e2e

  live-e2e-smoke:
    name: live-e2e smoke (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.live_e2e == 'true' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: platform
            fixtures: astro-vite7,monorepo-nested-vite,nextjs-app-router,vite8-sveltekit
          - group: svelte
            fixtures: vite8-sveltekit-stateful
          - group: react
            fixtures: vite8-react-css-modules,vite8-react-insert,vite8-react-plain,vite8-react-pricing-cards
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Cache fixture npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-fixture-npm-${{ hashFiles('tests/framework-fixtures/**/files/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fixture-npm-
      - name: Install dependencies
        run: npm ci
      - name: Resolve host browser
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge-stable; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "PUPPETEER_EXECUTABLE_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome/Chromium/Edge executable found on runner" >&2
          exit 1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the engine
        run: cargo build --release -p impeccable
      - name: Run live E2E tests
        run: npm run test:live-e2e
        env:
          IMPECCABLE_E2E_ONLY: ${{ matrix.fixtures }}
          IMPECCABLE_E2E_SCENARIOS: core,agent-target
          IMPECCABLE_E2E_TEST_TIMEOUT_MS: 180000
          IMPECCABLE_E2E_INSTALL_TIMEOUT_MS: 120000
          IMPECCABLE_E2E_DEV_READY_TIMEOUT_MS: 60000
          IMPECCABLE_E2E_ARTIFACT_DIR: test-results/live-e2e/${{ matrix.group }}
      - name: Upload live E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-smoke-${{ matrix.group }}-artifacts
          path: test-results/live-e2e
          if-no-files-found: ignore

  live-e2e-full:
    name: live-e2e full (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.live_e2e == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request')
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: platform
            fixtures: astro-vite7,monorepo-nested-vite,nextjs-app-router
          - group: svelte
            fixtures: vite8-sveltekit,vite8-sveltekit-stateful
          - group: react-a
            fixtures: vite8-https,vite8-react-base-path,vite8-react-csp-meta,vite8-react-css-modules,vite8-react-emotion
          - group: react-b
            fixtures: vite8-react-insert,vite8-react-mapped-list,vite8-react-modal,vite8-react-plain,vite8-react-pricing-cards
          - group: stateful
            fixtures: vite8-react-radix-dialog,vite8-react-router-spa,vite8-react-styled-components,vite8-react-tabs
          - group: styling
            fixtures: vite8-react-tailwindv3,vite8-react-tailwindv4,vite8-react-ts,vite8-react-tsx-repeated-aside,vite8-react-unocss,vite8-react-vanilla-extract
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Cache fixture npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-fixture-npm-${{ hashFiles('tests/framework-fixtures/**/files/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fixture-npm-
      - name: Install dependencies
        run: npm ci
      - name: Resolve host browser
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge-stable; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "PUPPETEER_EXECUTABLE_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome/Chromium/Edge executable found on runner" >&2
          exit 1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the engine
        run: cargo build --release -p impeccable
      - name: Run live E2E tests
        run: npm run test:live-e2e
        env:
          IMPECCABLE_E2E_ONLY: ${{ matrix.fixtures }}
          IMPECCABLE_E2E_TEST_TIMEOUT_MS: 300000
          IMPECCABLE_E2E_INSTALL_TIMEOUT_MS: 180000
          IMPECCABLE_E2E_DEV_READY_TIMEOUT_MS: 120000
          IMPECCABLE_E2E_ARTIFACT_DIR: test-results/live-e2e/${{ matrix.group }}
      - name: Upload live E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-full-${{ matrix.group }}-artifacts
          path: test-results/live-e2e
          if-no-files-found: ignore

  live-e2e-accept-cleanup:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.live_e2e_accept_cleanup == 'true'
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Skip without provider key
        if: ${{ env.ANTHROPIC_API_KEY == '' && env.DEEPSEEK_API_KEY == '' }}
        run: echo "Skipping provider-backed accept-cleanup regression because no provider API key is configured."
      - name: Checkout repository
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Cache fixture npm downloads
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-fixture-npm-${{ hashFiles('tests/framework-fixtures/**/files/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fixture-npm-
      - name: Install dependencies
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        run: npm ci
      - name: Resolve host browser
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge-stable; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "PUPPETEER_EXECUTABLE_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Install the pinned toolchain
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
      - name: Build the engine
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        run: cargo build --release -p impeccable
      - name: Run accept cleanup regression
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            export IMPECCABLE_E2E_LLM_PROVIDER=deepseek
          else
            export IMPECCABLE_E2E_LLM_PROVIDER=anthropic
          fi
          npm run test:live-e2e-accept-cleanup

  live-svelte-adapter-deepseek:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.live_svelte_adapter_deepseek == 'true'
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Skip without DeepSeek key
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: echo "Skipping Svelte adapter DeepSeek sweep because DEEPSEEK_API_KEY is not configured."
      - name: Checkout repository
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Cache fixture npm downloads
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-fixture-npm-${{ hashFiles('tests/framework-fixtures/**/files/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fixture-npm-
      - name: Install dependencies
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: npm ci
      - name: Resolve host browser
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge-stable; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "PUPPETEER_EXECUTABLE_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Install the pinned toolchain
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
      - name: Build the engine
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: cargo build --release -p impeccable
      - name: Run Svelte adapter DeepSeek sweep
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: npm run test:live-svelte-adapter-deepseek

  skill-behavior:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.skill_behavior == 'true' && github.event_name != 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare engine for protocol tests
        run: npm run fetch:engine
      - name: Run skill behavior tests
        run: npm run test:skill-behavior

  skill-workflow:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.skill_workflow
    timeout-minutes: 70
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMPECCABLE_SKILL_BEHAVIOR_MODELS: claude-sonnet-5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve host browser
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY is required'; exit 1; }
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge-stable; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "PUPPETEER_EXECUTABLE_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome/Chromium/Edge executable found" >&2
          exit 1
      - name: Prepare engine before billing
        run: npm run fetch:engine
      - name: Run completed skill workflows
        env:
          IMPECCABLE_SKILL_BEHAVIOR_TRACE_DIR: ${{ runner.temp }}/skill-workflow-traces
        run: npm run test:skill-workflow
      - name: Retain diagnostic traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-workflow-traces
          path: ${{ runner.temp }}/skill-workflow-traces
          retention-days: 7
