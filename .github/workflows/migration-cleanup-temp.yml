name: Migration Cleanup Temp

on:
  push:
    branches: [chore/node-npm-puppeteer-migration-20260915]
    paths:
      - 'scripts/migration-cleanup.mjs'
      - '.github/workflows/migration-cleanup-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply tooling migration cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/node-npm-puppeteer-migration-20260915
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Apply cleanup
        run: node scripts/migration-cleanup.mjs

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests
          git restore .github/workflows/release-engine.yml
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Apply tooling migration cleanup'
          git push origin HEAD:chore/node-npm-puppeteer-migration-20260915
